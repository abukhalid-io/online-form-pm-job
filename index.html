<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PM Control Panel</title>
<meta name="theme-color" content="#1a73e8">
<script>
  // Dijalankan sebelum halaman digambar supaya tidak ada kedip tema saat reload.
  (function () {
    var t = null;
    try { t = localStorage.getItem('pmTheme'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  })();
</script>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root {
    --surface-0: #f1f3f6; --surface-1: #ffffff; --surface-2: #ffffff;
    --text-primary: #1f2430; --text-secondary: #5f6470; --text-muted: #9498a3; --text-accent: #1a73e8;
    --border: #e3e5ea; --border-strong: #c7cbd4; --border-accent: #1a73e8;
    --bg-accent: #e8f0fe; --fill-accent: #1a73e8; --fill-accent-hover: #1558b0; --on-accent: #ffffff;
    --bg-success: #e6f4ea; --text-success: #1e7e34;
    --bg-warning: #fef7e0; --text-warning: #b06000;
    --bg-danger: #fce8e6; --text-danger: #c5221f; --border-danger: #c5221f;
    --radius: 8px; --font-mono: 'SFMono-Regular', Consolas, monospace;
    --page-max: 480px;
    --header-from: #1a73e8; --header-to: #1558b0; --on-header: #ffffff;
    --header-shadow: rgba(21,88,176,.26);
    --grid-line: rgba(26,115,232,.075); --grid-line-strong: rgba(26,115,232,.14);
    --gutter: 12px;
    --fam-ctrl-bg: #e8f0fe; --fam-ctrl-fg: #14508f; --fam-ctrl-line: #c3d9f8;
    --fam-mms-bg:  #e2f4ef; --fam-mms-fg:  #0f6552; --fam-mms-line:  #b5e2d5;
    --fam-etc-bg:  #f3edfd; --fam-etc-fg:  #5b3ba8; --fam-etc-line:  #ddd0f7;
  }
  /* Dark mode hanya aktif kalau dipilih manual lewat tombol tema. Sengaja TIDAK
     memakai prefers-color-scheme, supaya tampilan awal selalu terang walaupun
     sistem/HP pengguna sedang dark mode. */
  :root[data-theme="dark"] {
    --surface-0:#121316; --surface-1:#1c1e22; --surface-2:#1c1e22;
    --text-primary:#e8e9ec; --text-secondary:#aeb2bb; --text-muted:#797d87; --text-accent:#7fb0ff;
    --border:#2c2f35; --border-strong:#3c4048; --border-accent:#7fb0ff;
    --bg-accent:#123056; --fill-accent:#4c8dff; --fill-accent-hover:#699bff; --on-accent:#0b1220;
    --bg-success:#123021; --text-success:#5fd88a;
    --bg-warning:#3a2c05; --text-warning:#f2b93d;
    --bg-danger:#3a1210; --text-danger:#ff8a80; --border-danger:#ff8a80;
    --header-from:#1e3a63; --header-to:#14263f; --on-header:#eaf1ff;
    --header-shadow: rgba(0,0,0,.45);
    --grid-line: rgba(127,176,255,.07); --grid-line-strong: rgba(127,176,255,.13);
    --fam-ctrl-bg: #122744; --fam-ctrl-fg: #9cc4ff; --fam-ctrl-line: #1e3c66;
    --fam-mms-bg:  #0e2c25; --fam-mms-fg:  #7ed9be; --fam-mms-line:  #1b4a3c;
    --fam-etc-bg:  #241a3d; --fam-etc-fg:  #c3aef5; --fam-etc-line:  #3a2c5e;
  }
  /* Lebar container naik bertahap. Satu variabel dipakai bersama oleh .page dan
     .pmw-footer supaya footer (position:fixed) tetap sejajar dengan konten. */
  @media (min-width: 640px)  { :root { --page-max: 720px;  --gutter: 16px; } }
  @media (min-width: 1024px) { :root { --page-max: 980px;  --gutter: 20px; } }
  @media (min-width: 1280px) { :root { --page-max: 1140px; --gutter: 20px; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  /* Kertas milimeter: kotak halus tiap 24px, garis lebih tegas tiap 120px.
     Digambar di body supaya ikut menutupi seluruh kanvas viewport. */
  body {
    background-color: var(--surface-0);
    background-image:
      linear-gradient(var(--grid-line-strong) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line-strong) 1px, transparent 1px),
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  }
  input, select, textarea, button { font-family: inherit; }
  /* Transparan supaya grid ikut terlihat di area konten. Header, tabbar, footer,
     dan kartu punya latar solid sendiri sehingga teks tetap terbaca. */
  .page { max-width: var(--page-max); margin: 0 auto; min-height: 100vh; background: transparent; }
  /* Kartu membulat yang mengambang di atas grid, bukan bilah persegi penuh lebar. */
  .pmw-header { margin: var(--gutter) var(--gutter) 0; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; border-radius: 16px;
    background: linear-gradient(135deg, var(--header-from), var(--header-to));
    color: var(--on-header); box-shadow: 0 8px 20px var(--header-shadow); }
  .pmw-brand { width: 38px; height: 38px; flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; border-radius: 12px; background: rgba(255,255,255,.18); font-size: 20px; }
  .pmw-iconbtn { width: 32px; height: 32px; flex-shrink: 0; display: none; align-items: center; justify-content: center; border-radius: var(--radius); background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 18px; }
  .pmw-iconbtn:hover { background: var(--surface-0); }
  .pmw-iconbtn.theme { display: flex; margin-left: auto; }
  .pmw-header .pmw-iconbtn { color: var(--on-header); }
  .pmw-header .pmw-iconbtn:hover { background: rgba(255,255,255,.16); }
  .pmw-header h1 { margin: 0; font-size: 18px; font-weight: 500; }
  .pmw-header p { margin: 2px 0 0; font-size: 13px; color: rgba(255,255,255,.8); }
  /* Segmented control agar senada dengan header berbentuk kartu. */
  .pmw-tabbar { display: flex; gap: 6px; margin: var(--gutter) var(--gutter) 0; padding: 4px;
    background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; }
  .pmw-tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; font-size: 13px; font-weight: 500; color: var(--text-secondary); background: transparent; border: none; border-radius: 9px; cursor: pointer; }
  .pmw-tab.active { color: var(--text-accent); background: var(--bg-accent); }
  .pmw-main { padding: var(--gutter); padding-bottom: 96px; }
  .pmw-banner { display: none; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; padding: 10px 12px; border-radius: var(--radius); margin-bottom: 12px; }
  .pmw-banner.success { background: var(--bg-success); color: var(--text-success); }
  .pmw-banner.danger { background: var(--bg-danger); color: var(--text-danger); }
  .pmw-card { background: var(--surface-2); border-radius: 12px; padding: 1rem 1.1rem 0.75rem; margin-bottom: 12px; border: 0.5px solid var(--border); }
  .pmw-card h2 { font-size: 12px; margin: 0 0 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; font-weight: 500; }
  .pmw-card h2 i { color: var(--text-accent); font-size: 14px; margin-right: 4px; vertical-align: -1px; }
  .pmw-card h2 .sub { text-transform: none; font-weight: 400; letter-spacing: 0; color: var(--text-muted); margin-left: 4px; }
  .pmw-row { display: grid; grid-template-columns: 1fr; gap: 10px; }
  /* auto-fit: kolom kosong dikuncupkan, jadi kartu berisi 2 field (mis. Info panel)
     tetap melebar penuh, sementara kartu berisi 6-7 field (mis. Cabinet check)
     otomatis merapat jadi banyak kolom di layar lebar. */
  .pmw-row.c2 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .pmw-row.c3 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .pmw-field { margin-bottom: 12px; }
  .pmw-field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
  .pmw-field-row { display: flex; gap: 6px; align-items: flex-end; }
  .pmw-field-row .pmw-field { flex: 1; margin-bottom: 0; }
  input[type=text], input[type=date], select, textarea {
    width: 100%; padding: 8px 10px; border: 0.5px solid var(--border); border-radius: var(--radius);
    font-size: 13px; background: var(--surface-1); color: var(--text-primary);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--border-accent); box-shadow: 0 0 0 2px var(--bg-accent); }
  textarea.report { font-family: var(--font-mono); font-size: 11.5px; min-height: 260px; white-space: pre; width: 100%; }
  .pmw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  /* Warna dikelompokkan per keluarga panel (ITCCP / MMSP / lainnya) supaya grid
     lebih cepat dipindai - warnanya membawa informasi, bukan sekadar dekorasi. */
  .pmw-panelbtn { --pb-bg: var(--fam-etc-bg); --pb-fg: var(--fam-etc-fg); --pb-line: var(--fam-etc-line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: var(--pb-bg); border: 1px solid var(--pb-line); border-radius: 12px;
    padding: 13px 8px; font-size: 12px; font-weight: 600; color: var(--pb-fg); cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease; }
  .pmw-panelbtn.fam-ctrl { --pb-bg: var(--fam-ctrl-bg); --pb-fg: var(--fam-ctrl-fg); --pb-line: var(--fam-ctrl-line); }
  .pmw-panelbtn.fam-mms  { --pb-bg: var(--fam-mms-bg);  --pb-fg: var(--fam-mms-fg);  --pb-line: var(--fam-mms-line); }
  .pmw-panelbtn i { font-size: 18px; color: var(--pb-fg); width: 34px; height: 34px; display: flex;
    align-items: center; justify-content: center; border-radius: 50%;
    background: var(--surface-1); border: 1px solid var(--pb-line); }
  .pmw-panelbtn:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(0,0,0,.12); }
  /* Kartu pemilihan modul di menu utama */
  .pmw-modulegrid { display: grid; gap: 10px; }
  .pmw-module { --mb-bg: var(--fam-ctrl-bg); --mb-fg: var(--fam-ctrl-fg); --mb-line: var(--fam-ctrl-line);
    display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; width: 100%;
    background: var(--mb-bg); border: 1px solid var(--mb-line); border-radius: 14px; padding: 16px;
    color: var(--mb-fg); transition: transform .12s ease, box-shadow .12s ease; }
  .pmw-module.mod-gas { --mb-bg: var(--fam-mms-bg); --mb-fg: var(--fam-mms-fg); --mb-line: var(--fam-mms-line); }
  .pmw-module:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.12); }
  .pmw-module .ico { width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; border-radius: 12px; background: var(--surface-1);
    border: 1px solid var(--mb-line); font-size: 22px; }
  .pmw-module .txt { flex: 1; }
  .pmw-module .txt strong { display: block; font-size: 15px; font-weight: 600; }
  .pmw-module .txt small { display: block; margin-top: 3px; font-size: 12px; font-weight: 400; opacity: .78; line-height: 1.35; }
  .pmw-module .arrow { font-size: 18px; opacity: .5; }
  /* Timer stabilisasi gas */
  .pmw-timer { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 12px;
    background: var(--bg-accent); border: 1px solid var(--border-accent); margin-bottom: 12px; }
  .pmw-timer .clock { font-family: var(--font-mono); font-size: 26px; font-weight: 600;
    color: var(--text-accent); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .pmw-timer .lbl { flex: 1; font-size: 12px; line-height: 1.4; color: var(--text-secondary); }
  .pmw-timer.done { background: var(--bg-success); border-color: var(--text-success); }
  .pmw-timer.done .clock { color: var(--text-success); }
  .pmw-timer.done .lbl { color: var(--text-success); font-weight: 500; }
  .pmw-readonly { font-size: 12px; color: var(--text-secondary); display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; }
  .pmw-readonly + .pmw-readonly { border-top: 0.5px dashed var(--border); }
  .pmw-readonly b { font-weight: 600; color: var(--text-primary); }
  .pmw-hint { font-size: 12px; padding: 8px 10px; border-radius: var(--radius); margin: 4px 0 12px; display: flex; align-items: center; gap: 6px; background: var(--bg-accent); color: var(--text-accent); }
  .pmw-note-hint { font-size: 11px; color: var(--text-muted); margin-top: -6px; margin-bottom: 12px; }
  .pmw-footer { position: fixed; left: 0; right: 0; bottom: 0; max-width: var(--page-max); margin: 0 auto; background: var(--surface-1); padding: 10px 16px; border-top: 0.5px solid var(--border); display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pmw-footer .info { flex: 1 1 100%; font-size: 11px; color: var(--text-muted); }
  .pmw-btn { border: 0.5px solid var(--border-strong); background: transparent; border-radius: var(--radius); padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text-primary); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .pmw-btn:hover { background: var(--surface-0); }
  .pmw-btn.primary { background: var(--fill-accent); border-color: var(--fill-accent); color: var(--on-accent); }
  .pmw-btn.primary:hover { background: var(--fill-accent-hover); }
  .pmw-btn:disabled { opacity: .5; cursor: not-allowed; }
  .pmw-btn.block { width: 100%; justify-content: center; margin-top: 4px; }
  .pmw-navbtn { width: 100%; background: transparent; border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 10px; font-size: 12.5px; font-weight: 500; color: var(--text-accent); cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .pmw-navbtn:hover { background: var(--surface-0); }
  .pmw-datarow { background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
  .pmw-datarow-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .pmw-datarow .panel { font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .pmw-datarow .panel i { font-size: 14px; color: var(--text-accent); }
  .pmw-datarow .date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .pmw-statuspill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 500; }
  .pmw-statuspill.good { background: var(--bg-success); color: var(--text-success); }
  .pmw-statuspill.medium { background: var(--bg-warning); color: var(--text-warning); }
  .pmw-statuspill.high { background: var(--bg-danger); color: var(--text-danger); }
  .pmw-datarow-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .pmw-mini-btn { font-size: 11px; padding: 5px 10px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-secondary); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .pmw-mini-btn:hover { background: var(--surface-0); }
  .pmw-mini-btn.danger { color: var(--text-danger); border-color: var(--border-danger); }
  .pmw-empty { font-size: 12px; color: var(--text-muted); padding: 20px 0; text-align: center; }
  .pmw-empty i { font-size: 22px; display: block; margin-bottom: 6px; }
  .pmw-inline-report { margin-top: 10px; padding-top: 10px; border-top: 0.5px dashed var(--border); }
  .pmw-filter-count { font-size: 11px; color: var(--text-muted); margin: -4px 0 10px; }
  .pmw-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border-strong); border-top-color: var(--text-accent); border-radius: 50%; animation: pmw-spin .7s linear infinite; }
  @keyframes pmw-spin { to { transform: rotate(360deg); } }
  @media (min-width: 640px) {
    .pmw-header { padding: 16px 20px; }
    .pmw-header h1 { font-size: 20px; }
    .pmw-tab { padding: 11px; font-size: 14px; }
    .pmw-footer { padding: 12px 20px; }
    .pmw-footer .info { flex: 1 1 auto; }
  }
  @media (min-width: 1024px) {
    .pmw-footer { border-left: 0.5px solid var(--border); border-right: 0.5px solid var(--border); }
    .pmw-card { padding: 1.15rem 1.35rem 0.85rem; }
    textarea.report { min-height: 340px; font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="pmw-header">
    <button type="button" class="pmw-iconbtn" id="pwBack" aria-label="Kembali"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
    <div class="pmw-brand" id="pwBrand"><i class="ti ti-clipboard-check" aria-hidden="true"></i></div>
    <div>
      <h1 id="pwTitle">PM Control Panel</h1>
      <p id="pwSub">Memuat...</p>
    </div>
    <button type="button" class="pmw-iconbtn theme" id="pwTheme" aria-label="Ganti tema terang/gelap"><i class="ti ti-moon" aria-hidden="true"></i></button>
  </div>
  <div class="pmw-tabbar" id="pwTabbar">
    <button type="button" class="pmw-tab active" id="pwTabHome"><i class="ti ti-square-plus" aria-hidden="true"></i>Input</button>
    <button type="button" class="pmw-tab" id="pwTabData"><i class="ti ti-list-details" aria-hidden="true"></i>Data tersimpan</button>
  </div>
  <div class="pmw-main">
    <div class="pmw-banner" id="pwBanner"><i class="ti ti-circle-check" aria-hidden="true"></i><span id="pwBannerText"></span></div>
    <div id="pwMenu">
      <div class="pmw-modulegrid">
        <button type="button" class="pmw-module mod-cp" id="pwModCp">
          <span class="ico"><i class="ti ti-server-2" aria-hidden="true"></i></span>
          <span class="txt">
            <strong>PM Control Panel</strong>
            <small>Checklist kabinet, modul dasar, controller, lampu &amp; kipas</small>
          </span>
          <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
        </button>
        <button type="button" class="pmw-module mod-gas" id="pwModGas">
          <span class="ico"><i class="ti ti-gauge" aria-hidden="true"></i></span>
          <span class="txt">
            <strong>PM Gas Analyzer</strong>
            <small>Verifikasi zero &amp; span CO / CO&#8322; / O&#8322;, dengan timer stabilisasi</small>
          </span>
          <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div id="pwHome" style="display:none;">
      <div class="pmw-card">
        <h2><i class="ti ti-calendar" aria-hidden="true"></i>Tanggal pemeliharaan</h2>
        <div class="pmw-field"><input type="date" id="pwDate"></div>
      </div>
      <div class="pmw-card">
        <h2><i class="ti ti-server-2" aria-hidden="true"></i>Pilih panel</h2>
        <div class="pmw-field"><input type="text" id="pwSearch" placeholder="Cari kode panel..."></div>
        <div class="pmw-grid" id="pwGrid"></div>
      </div>
      <button type="button" class="pmw-navbtn" id="pwAddPanel"><i class="ti ti-plus" aria-hidden="true"></i>Tambah panel baru</button>
    </div>
    <div id="pwForm" style="display:none;"></div>
    <div id="pwData" style="display:none;">
      <div class="pmw-card">
        <h2><i class="ti ti-filter" aria-hidden="true"></i>Filter</h2>
        <div class="pmw-field"><input type="text" id="pwDataSearch" placeholder="Filter kode panel..."></div>
        <div class="pmw-row c2">
          <div class="pmw-field">
            <label>Status report</label>
            <select id="pwDataStatus">
              <option value="">Semua status</option>
              <option value="good">GOOD</option>
              <option value="medium">MINOR ISSUE</option>
              <option value="high">NEEDS ATTENTION</option>
            </select>
          </div>
          <div class="pmw-field">
            <label>Tahun</label>
            <select id="pwDataYear"></select>
          </div>
        </div>
        <div class="pmw-filter-count" id="pwDataFilterCount"></div>
      </div>
      <div class="pmw-card">
        <h2><i class="ti ti-database" aria-hidden="true"></i>Data tersimpan <span class="sub" id="pwDataCount"></span></h2>
        <div id="pwDataList"></div>
      </div>
    </div>
    <div id="pwGasHome" style="display:none;">
      <div class="pmw-card">
        <h2><i class="ti ti-filter" aria-hidden="true"></i>Cari sesi</h2>
        <div class="pmw-field"><input type="text" id="pwGasSearch" placeholder="Cari ID sesi / analyzer / teknisi..."></div>
      </div>
      <button type="button" class="pmw-navbtn" id="pwGasNewBtn"><i class="ti ti-plus" aria-hidden="true"></i>Sesi PM baru</button>
      <div class="pmw-card">
        <h2><i class="ti ti-list-details" aria-hidden="true"></i>Sesi PM <span class="sub" id="pwGasCount"></span></h2>
        <div id="pwGasList"></div>
      </div>
    </div>
    <div id="pwGasSesi" style="display:none;"></div>
    <div id="pwGasIter" style="display:none;"></div>
  </div>
  <div class="pmw-footer" id="pwFooter">
    <div class="info">Kolom kosong otomatis "-"</div>
    <button type="button" class="pmw-btn" id="pwReportBtn"><i class="ti ti-file-text" aria-hidden="true"></i>Generate report</button>
    <button type="button" class="pmw-btn primary" id="pwSubmit"><i class="ti ti-device-floppy" aria-hidden="true"></i>Simpan data</button>
  </div>
</div>
<script>
(function(){
  // ============================================================
  // KONFIGURASI - ganti URL ini kalau deployment /exec kamu beda
  // ============================================================
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwnAE6QaqyhoogRb6rwpSoaIfVgY5f0wDLgkYA4qpF3yIzYQCmbO09bg0e1FjiIepnDpg/exec';

  var STATUS = ["OK","NORMAL","WARNING","ALARM","FAULT","NOT OK","-"];
  var LAMP = ["ON","OFF","-"];
  var FANSTATUS = ["ON","OFF","-"];
  var GOOD_SET = ["OK","NORMAL","ON","CLEAN","GOOD","-"];
  var HIGH_WORDS = ["alarm","fault","not ok"];
  var MED_WORDS = ["warning","off"];
  var CONTROLLER_SUGGESTIONS = ["3500 BENTLY NEVADA","TRICONEX"];
  var C4_SUGGESTIONS = ["WOOD WARD"];
  var BASIC_FIELDS = [['breaker','Breaker'],['psu24vdc','PSU 24 VDC'],['switchHub','Switch Hub'],['fuseBoard','Fuse Board'],['resistorBoard','Resistor Board'],['barier','Barier']];

  var CAB_DEFS = [
    { key: 'cabInspection', label: 'General inspection of cabinets',
      options: [['Good',null],['Fair','medium'],['Poor','high'],['-',null]] },
    { key: 'cabDustFilters', label: 'Cabinets dust filters',
      options: [['Clean',null],['Slightly dirty','medium'],['Dirty','medium'],['Needs replacement','high'],['-',null]] },
    { key: 'cabDoorSwitches', label: 'Test door switches for lamps/lights',
      options: [['Functioning',null],['Not functioning','high'],['-',null]] },
    { key: 'cabFanFunction', label: 'Cabinets fan function',
      options: [['Running',null],['Not running','high'],['-',null]] },
    { key: 'cabCableRouting', label: 'Proper cable routing, dressing, sealings',
      options: [['Proper',null],['Needs adjustment','medium'],['Not proper','high'],['-',null]] },
    { key: 'cabDoorClosure', label: 'Cabinet door closure and locking mechanism',
      options: [['Secure',null],['Loose','medium'],['Not secure','high'],['-',null]] }
  ];
  var CAB_FAN_RUNNING = { key: 'cabFanRunning', label: 'Fan running',
    options: [['Running',null],['Not running','high'],['-',null]] };

  var pwHome = document.getElementById('pwHome');
  var pwForm = document.getElementById('pwForm');
  var pwData = document.getElementById('pwData');
  var pwBack = document.getElementById('pwBack');
  var pwBrand = document.getElementById('pwBrand');
  var pwTabbar = document.getElementById('pwTabbar');
  var pwTabHome = document.getElementById('pwTabHome');
  var pwTabData = document.getElementById('pwTabData');
  var pwTitle = document.getElementById('pwTitle');
  var pwSub = document.getElementById('pwSub');
  var pwFooter = document.getElementById('pwFooter');
  var pwGrid = document.getElementById('pwGrid');
  var pwSearch = document.getElementById('pwSearch');
  var pwSubmit = document.getElementById('pwSubmit');
  var pwReportBtn = document.getElementById('pwReportBtn');
  var pwDataList = document.getElementById('pwDataList');
  var pwDataSearch = document.getElementById('pwDataSearch');
  var pwDataStatus = document.getElementById('pwDataStatus');
  var pwDataYear = document.getElementById('pwDataYear');
  var pwDataCount = document.getElementById('pwDataCount');
  var pwDataFilterCount = document.getElementById('pwDataFilterCount');
  var pwBanner = document.getElementById('pwBanner');
  var pwBannerText = document.getElementById('pwBannerText');
  var pwTheme = document.getElementById('pwTheme');

  // ---------- tema (default terang, pilihan disimpan per perangkat) ----------
  function applyTheme(mode){
    document.documentElement.setAttribute('data-theme', mode);
    var icon = pwTheme.querySelector('i');
    if (icon) icon.className = 'ti ' + (mode === 'dark' ? 'ti-sun' : 'ti-moon');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'dark' ? '#1e3a63' : '#1a73e8');
  }
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  pwTheme.addEventListener('click', function(){
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('pmTheme', next); } catch (e) {}
  });

  var current = null;
  var componentRegistry = [];
  var currentCabDefs = [];
  var editingRowIndex = null;
  var cameFromData = false;
  var bannerTimer = null;
  var panelListCache = [];
  var recordsCache = [];

  function today(){ var d=new Date(); var p=function(n){return String(n).padStart(2,'0');}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  // Backend kadang mengirim Date.toString() penuh, bukan yyyy-MM-dd. Filter tahun
  // dan pengurutan mengandalkan format ISO, jadi dinormalkan sekali di sini.
  function normalizeDate(v){
    var s = (v == null ? '' : String(v)).trim();
    if (!s) return '';
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    var d = new Date(s);
    if (isNaN(d.getTime())) return s;
    var p = function(n){ return String(n).padStart(2,'0'); };
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  }
  document.getElementById('pwDate').value = today();

  // ---------- API helpers ----------
  function apiGet(action, params){
    var url = APPS_SCRIPT_URL + '?action=' + encodeURIComponent(action);
    if (params) Object.keys(params).forEach(function(k){ url += '&' + k + '=' + encodeURIComponent(params[k]); });
    return fetch(url).then(function(r){ return r.json(); }).then(function(res){
      if (!res.success) throw new Error(res.message || 'Gagal mengambil data.');
      return res.data;
    });
  }
  function apiPost(action, payload){
    var body = Object.assign({ action: action }, payload);
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); }).then(function(res){
      if (!res.success) throw new Error(res.message || 'Gagal menyimpan data.');
      return res;
    });
  }

  function showBanner(msg, isError){
    pwBannerText.textContent = msg;
    pwBanner.className = 'pmw-banner ' + (isError ? 'danger' : 'success');
    pwBanner.style.display = 'flex';
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function(){ pwBanner.style.display = 'none'; }, isError ? 5000 : 2600);
  }

  // ---------- navigasi ----------
  // Satu tempat untuk semua pengaturan layar: mana yang tampil, tombol apa yang
  // aktif, dan ke mana tombol kembali menuju. Sebelumnya tersebar di tiap fungsi
  // dan mudah tidak sinkron begitu jumlah layar bertambah.
  var SCREENS = ['pwMenu','pwHome','pwForm','pwData','pwGasHome','pwGasSesi','pwGasIter'];
  var backAction = null;

  function showScreen(id){
    if (id !== 'pwGasIter') stopGasTimer();
    SCREENS.forEach(function(s){
      var el = document.getElementById(s);
      if (el) el.style.display = (s === id ? 'block' : 'none');
    });
  }
  function setChrome(o){
    pwFooter.style.display = o.footer ? 'flex' : 'none';
    pwBack.style.display   = o.back ? 'flex' : 'none';
    pwBrand.style.display  = o.back ? 'none' : 'flex';
    pwTabbar.style.display = o.tabbar ? 'flex' : 'none';
    pwTitle.textContent = o.title;
    pwSub.textContent = o.sub;
    backAction = o.backTo || goMenu;
  }
  function setTab(tab){
    pwTabHome.classList.toggle('active', tab === 'home');
    pwTabData.classList.toggle('active', tab === 'data');
  }

  function goMenu(){
    showScreen('pwMenu');
    setChrome({ title: 'Aplikasi PM', sub: 'Pilih modul pemeliharaan' });
    current = null; editingRowIndex = null; cameFromData = false;
  }
  function goHome(){
    showScreen('pwHome');
    setChrome({ back: true, tabbar: true, backTo: goMenu,
      title: 'PM Control Panel', sub: 'Pilih panel untuk mulai input data' });
    current = null; editingRowIndex = null; cameFromData = false;
    setTab('home');
    loadPanelList();
  }
  function goData(){
    showScreen('pwData');
    setChrome({ back: true, tabbar: true, backTo: goMenu,
      title: 'PM Control Panel', sub: 'Semua data PM yang sudah diinput' });
    current = null;
    setTab('data');
    loadRecords();
  }
  pwBack.addEventListener('click', function(){ if (backAction) backAction(); });
  pwTabHome.addEventListener('click', goHome);
  pwTabData.addEventListener('click', goData);
  document.getElementById('pwModCp').addEventListener('click', goHome);
  document.getElementById('pwModGas').addEventListener('click', goGasHome);

  // ---------- Home: daftar panel ----------
  function loadPanelList(){
    pwGrid.innerHTML = '<div class="pmw-empty"><span class="pmw-spinner" aria-hidden="true"></span> Memuat daftar panel...</div>';
    apiGet('list').then(function(list){
      panelListCache = list || [];
      renderGrid(pwSearch.value);
    }).catch(function(err){
      pwGrid.innerHTML = '';
      showBanner('Gagal memuat daftar panel: ' + err.message, true);
    });
  }
  // Keluarga panel menentukan warna tombolnya di grid.
  function panelFamily(code){
    var u = String(code).toUpperCase();
    if (u.indexOf('ITCCP') > -1 || u.indexOf('IMCCP') > -1) return 'fam-ctrl';
    if (u.indexOf('MMSP') > -1) return 'fam-mms';
    return 'fam-etc';
  }
  function renderGrid(filter){
    pwGrid.innerHTML = '';
    var list = panelListCache.filter(function(p){ return !filter || p.toLowerCase().indexOf(filter.toLowerCase()) > -1; });
    if (!list.length) { pwGrid.innerHTML = '<div class="pmw-empty">Belum ada panel. Pakai tombol "Tambah panel baru" di bawah.</div>'; return; }
    list.forEach(function(p){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pmw-panelbtn ' + panelFamily(p);
      b.innerHTML = '<i class="ti ti-server-2" aria-hidden="true"></i><span>' + p + '</span>';
      b.addEventListener('click', function(){ openForm(p, null); });
      pwGrid.appendChild(b);
    });
  }
  pwSearch.addEventListener('input', function(){ renderGrid(pwSearch.value); });
  document.getElementById('pwAddPanel').addEventListener('click', function(){
    var code = window.prompt('Masukkan kode panel baru:');
    if (code && code.trim()) openForm(code.trim(), null);
  });

  // ---------- helper builder form ----------
  function field(label, inner){
    var w = document.createElement('div'); w.className = 'pmw-field';
    var l = document.createElement('label'); l.textContent = label; w.appendChild(l); w.appendChild(inner); return w;
  }
  function select(opts, def, id){
    var s = document.createElement('select');
    if (id) s.id = id;
    opts.forEach(function(o){ var op = document.createElement('option'); op.value=o; op.textContent=o; if(o===def) op.selected=true; s.appendChild(op); });
    return s;
  }
  function selectFromDefs(defs, id, prefillValue){
    var s = document.createElement('select'); s.id = id;
    defs.options.forEach(function(pair, idx){
      var op = document.createElement('option'); op.value = pair[0]; op.textContent = pair[0];
      var isDefault = prefillValue ? (pair[0] === prefillValue) : (idx === 0);
      if (isDefault) op.selected = true;
      s.appendChild(op);
    });
    return s;
  }
  function plainText(value, placeholder, id){
    var input = document.createElement('input'); input.type='text';
    if (id) input.id = id;
    if (value) input.value = value;
    if (placeholder) input.placeholder = placeholder;
    return input;
  }
  function comboText(value, placeholder, id, options){
    var wrap = document.createElement('div');
    var input = document.createElement('input'); input.type = 'text'; input.id = id;
    var listId = id + 'List';
    input.setAttribute('list', listId);
    if (value) input.value = value;
    if (placeholder) input.placeholder = placeholder;
    var dl = document.createElement('datalist'); dl.id = listId;
    (options || []).forEach(function(o){ var op = document.createElement('option'); op.value = o; dl.appendChild(op); });
    wrap.appendChild(input); wrap.appendChild(dl);
    return wrap;
  }
  function card(title, sub, icon){
    var c = document.createElement('div'); c.className = 'pmw-card';
    var h = document.createElement('h2');
    h.innerHTML = (icon ? '<i class="ti ' + icon + '" aria-hidden="true"></i>' : '') + title + (sub ? ' <span class="sub">'+sub+'</span>' : '');
    c.appendChild(h); return c;
  }
  function row(cls){ var r = document.createElement('div'); r.className = 'pmw-row ' + (cls||''); return r; }
  function tidakAdaBtn(ids){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'pmw-mini-btn'; b.textContent = 'Tidak ada';
    b.addEventListener('click', function(){
      ids.forEach(function(id){ var el = document.getElementById(id); if (el) el.value = '-'; });
    });
    return b;
  }
  function fieldRowWithBtn(fieldEl, btn){
    var wrap = document.createElement('div'); wrap.className = 'pmw-field-row';
    wrap.appendChild(fieldEl); wrap.appendChild(btn);
    return wrap;
  }

  function isItccp(panel){
    var u = panel.toUpperCase();
    return u.indexOf('ITCCP') > -1 || u.indexOf('IMCCP') > -1;
  }
  function regStatus(id, label){ componentRegistry.push({ kind:'status', id: id, label: label }); }
  function regPair(statusId, valueId, label, unit, suffix){
    componentRegistry.push({ kind:'pair', statusId: statusId, valueId: valueId, label: label, unit: unit, suffix: suffix || '' });
  }
  function regFixedController(n, type, statusId){
    componentRegistry.push({ kind:'fixedController', n: n, type: type, statusId: statusId, label: 'Controller C'+n+' ('+type+')' });
  }
  function findComp(prefillComponents, label){
    if (!prefillComponents) return null;
    return prefillComponents.filter(function(c){ return c.label === label; })[0] || null;
  }

  // ---------- render form (auto: panel ditemukan di histori / manual: panel baru) ----------
  function openForm(panel, prefillRecord){
    current = panel;
    editingRowIndex = prefillRecord ? prefillRecord.rowIndex : null;
    componentRegistry = [];
    showScreen('pwForm');
    setChrome({ back: true, footer: true, backTo: cameFromData ? goData : goHome,
      title: panel, sub: editingRowIndex ? 'Edit data tersimpan' : 'Memuat data panel...' });
    pwForm.innerHTML = '<div class="pmw-empty"><span class="pmw-spinner" aria-hidden="true"></span> Memuat...</div>';

    if (prefillRecord) {
      renderFormBody(panel, { found: true, fromRecord: true, prefill: prefillRecord.data });
      return;
    }
    apiGet('template', { panel: panel }).then(function(tpl){
      renderFormBody(panel, tpl);
    }).catch(function(err){
      showBanner('Gagal memuat template panel: ' + err.message, true);
      renderFormBody(panel, { found: false });
    });
  }

  function renderFormBody(panel, tpl){
    pwSub.textContent = editingRowIndex ? 'Edit data tersimpan' : (tpl.found ? 'Isi status / nilai komponen' : 'Panel baru - isi semua komponen yang ada');
    pwForm.innerHTML = '';
    componentRegistry = [];

    var prefill = tpl.fromRecord ? tpl.prefill : null;

    var cInfo = card('Info panel', null, 'ti-info-circle'); var rInfo = row('c2');
    var descVal = prefill ? prefill.desc : (tpl.desc || '');
    var titleVal = prefill ? prefill.title : (tpl.reportTitle || '');
    rInfo.appendChild(field('Deskripsi panel', plainText(descVal, 'cth: MMS CABINET FOR PROCESS AIR COMP', 'pwDesc')));
    rInfo.appendChild(field('Judul laporan (untuk apa)', plainText(titleVal, 'cth: DCS Marshalling Cabinet for Ammonia', 'pwRptTitle')));
    cInfo.appendChild(rInfo); pwForm.appendChild(cInfo);

    if (tpl.found && !prefill) {
      renderAutoSections(tpl);
    } else if (prefill) {
      renderAutoFromPrefill(panel, prefill);
    } else {
      renderManualSections();
    }

    currentCabDefs = CAB_DEFS.slice();
    if (isItccp(panel)) currentCabDefs.push(CAB_FAN_RUNNING);
    var cCab = card('Cabinet and accessories check', 'pilihan disesuaikan per item', 'ti-clipboard-check');
    var rCab = row('c2');
    currentCabDefs.forEach(function(defs){
      var id = 'pw_' + defs.key;
      var prefillVal = prefill ? prefill.cab[defs.key] : (tpl.cab ? tpl.cab[defs.key] : null);
      rCab.appendChild(field(defs.label, selectFromDefs(defs, id, prefillVal)));
    });
    cCab.appendChild(rCab); pwForm.appendChild(cCab);

    var c6 = card('Kondisi dan catatan', null, 'ti-notes'); var r6 = row();
    var condVal = prefill ? prefill.condition : 'CLEAN';
    r6.appendChild(field('Kondisi panel', select(['CLEAN','DIRTY','-'], condVal, 'pwCondition')));
    var ta = document.createElement('textarea'); ta.placeholder = 'Tulis bebas, boleh bahasa Indonesia - otomatis diterjemahkan ke Inggris saat generate report'; ta.rows = 3; ta.id = 'pwNote';
    ta.value = prefill ? (prefill.note || '') : '';
    r6.appendChild(field('Catatan (NB)', ta));
    var noteHint = document.createElement('div'); noteHint.className = 'pmw-note-hint';
    noteHint.textContent = 'Contoh: "lampu belakang mati, baterai overspeed protection modul B lemah" -> otomatis jadi bahasa Inggris di report.';
    r6.appendChild(noteHint);
    c6.appendChild(r6); pwForm.appendChild(c6);

    var reportBox = document.createElement('div'); reportBox.id = 'pwReportBox'; reportBox.style.display = 'none';
    var c7 = card('Report', 'auto EN, kesimpulan di bawah', 'ti-file-text');
    var rTa = document.createElement('textarea'); rTa.className = 'report'; rTa.id = 'pwReportOut'; rTa.readOnly = true;
    c7.appendChild(rTa);
    reportBox.appendChild(c7);
    pwForm.appendChild(reportBox);

    var hint = document.createElement('div'); hint.className = 'pmw-hint';
    var hintIcon = editingRowIndex ? 'ti-edit' : (tpl.found ? 'ti-sparkles' : 'ti-alert-circle');
    var hintText = editingRowIndex ? 'Mode edit - nilai di bawah adalah data yang sudah tersimpan.' :
      (tpl.found ? 'Komponen otomatis dimuat dari histori. Tinggal isi nilai/status-nya.' :
      'Panel baru, belum ada histori. Isi semua komponen yang benar-benar ada, pakai tombol "Tidak ada" untuk yang tidak ada.');
    hint.innerHTML = '<i class="ti ' + hintIcon + '" aria-hidden="true"></i><span>' + hintText + '</span>';
    pwForm.insertBefore(hint, pwForm.firstChild);

    pwSubmit.innerHTML = '<i class="ti ti-device-floppy" aria-hidden="true"></i>' + (editingRowIndex ? 'Update data' : 'Simpan data');
  }

  function renderAutoSections(tpl){
    var basic = BASIC_FIELDS.filter(function(k){ return tpl[k[0]]; });
    if (basic.length){
      var c1 = card('Modul dasar', null, 'ti-bolt'); var r1 = row('c3');
      basic.forEach(function(k){
        var id = 'pw_' + k[0];
        r1.appendChild(field(k[1], select(STATUS, 'OK', id)));
        regStatus(id, k[1]);
      });
      c1.appendChild(r1); pwForm.appendChild(c1);
    }
    ['c1','c2','c3'].forEach(function(k,i){
      var comp = tpl[k];
      if (!comp || !comp.exists) return;
      var id = 'pw_' + k + 'Status';
      var c = card('Controller C'+(i+1), comp.type, 'ti-cpu'); var r = row();
      r.appendChild(field('Status', select(STATUS, 'OK', id)));
      c.appendChild(r); pwForm.appendChild(c);
      regFixedController(i+1, comp.type, id);
    });
    if (tpl.c4 && tpl.c4.exists){
      var c4 = card('C4', tpl.c4.type, 'ti-gauge'); var r4 = row('c2');
      ['ma','mb','mc'].forEach(function(sub){
        var m = tpl['c4'+sub];
        if (!m || !m.exists) return;
        var letter = sub.slice(1).toUpperCase();
        var valId = 'pw_c4'+sub+'Val', stId = 'pw_c4'+sub+'Status';
        var lastVal = m.id !== '-' ? m.id : '';
        r4.appendChild(field('Modul '+letter+' - nilai RPM', plainText(lastVal, 'cth: '+(lastVal || '5484'), valId)));
        r4.appendChild(field('Modul '+letter+' - status', select(STATUS, 'OK', stId)));
        regPair(stId, valId, 'Woodward Module '+letter, 'RPM');
      });
      c4.appendChild(r4); pwForm.appendChild(c4);
    }
    var lf = [];
    if (tpl.lamp1){ var lid1='pw_lamp1'; lf.push(field('Lamp 1', select(LAMP,'ON', lid1))); regStatus(lid1,'Lamp 1'); }
    if (tpl.lamp2){ var lid2='pw_lamp2'; lf.push(field('Lamp 2', select(LAMP,'ON', lid2))); regStatus(lid2,'Lamp 2'); }
    if (tpl.fan1){
      var f1s='pw_fan1Status', f1a='pw_fan1Amp';
      lf.push(field('Fan 1 - status', select(FANSTATUS,'ON', f1s)));
      lf.push(field('Fan 1 - nilai ampere', plainText(tpl.fan1Last !== '-' ? tpl.fan1Last : '', 'cth: 0,15', f1a)));
      regPair(f1s, f1a, 'Fan 1', 'Ampere', ' A');
    }
    if (tpl.fan2){
      var f2s='pw_fan2Status', f2a='pw_fan2Amp';
      lf.push(field('Fan 2 - status', select(FANSTATUS,'ON', f2s)));
      lf.push(field('Fan 2 - nilai ampere', plainText(tpl.fan2Last !== '-' ? tpl.fan2Last : '', 'cth: 0,15', f2a)));
      regPair(f2s, f2a, 'Fan 2', 'Ampere', ' A');
    }
    if (lf.length){
      var c5 = card('Lampu dan kipas', null, 'ti-bulb'); var r5 = row('c2');
      lf.forEach(function(el){ r5.appendChild(el); }); c5.appendChild(r5); pwForm.appendChild(c5);
    }
  }

  function renderAutoFromPrefill(panel, prefill){
    var comps = prefill.components || [];
    BASIC_FIELDS.forEach(function(k){
      var comp = findComp(comps, k[1]);
      if (!comp) return;
      var id = 'pw_' + k[0];
      var c1 = pwForm.querySelector('#pw-basic-card');
      if (!c1) { c1 = card('Modul dasar', null, 'ti-bolt'); c1.id = 'pw-basic-card'; c1.appendChild(row('c3')); pwForm.appendChild(c1); }
      c1.querySelector('.pmw-row').appendChild(field(k[1], select(STATUS, comp.value, id)));
      regStatus(id, k[1]);
    });
    [1,2,3].forEach(function(n){
      var prefix = 'Controller C' + n + ' (';
      var comp = comps.filter(function(c){ return c.label.indexOf(prefix) === 0; })[0];
      if (!comp) return;
      var type = comp.label.slice(prefix.length, -1);
      var id = 'pw_c' + n + 'Status';
      var c = card('Controller C'+n, type, 'ti-cpu'); var r = row();
      r.appendChild(field('Status', select(STATUS, comp.value, id)));
      c.appendChild(r); pwForm.appendChild(c);
      regFixedController(n, type, id);
    });
    var c4mods = ['A','B','C'].map(function(letter){ return { letter: letter, comp: findComp(comps, 'Woodward Module ' + letter) }; }).filter(function(x){ return x.comp; });
    if (c4mods.length){
      var c4 = card('C4', 'WOOD WARD', 'ti-gauge'); var r4 = row('c2');
      c4mods.forEach(function(x){

  // ---------- status/severity/translate ----------
  function statusWord(v){
    var s = (v || '').toString().trim().toUpperCase();
    if (s === '' || s === '-') return null;
    var map = { 'OK':'ok','NORMAL':'normal','WARNING':'warning','ALARM':'alarm','FAULT':'fault','NOT OK':'not ok','ON':'on','OFF':'off' };
    return map[s] || s.toLowerCase();
  }
  function isGood(v){
    var s = (v||'').toString().trim().toUpperCase();
    return GOOD_SET.indexOf(s) > -1;
  }
  function severityOfComponent(word){
    if (!word) return null;
    if (HIGH_WORDS.indexOf(word) > -1) return 'high';
    if (MED_WORDS.indexOf(word) > -1) return 'medium';
    return null;
  }
  function cabResolve(defs, rawValue){
    var found = defs.options.filter(function(o){ return o[0] === rawValue; })[0];
    if (!found) return null;
    if (found[0] === '-') return null;
    return { word: found[0].toLowerCase(), severity: found[1] };
  }

  var DICT = [
    ["tidak berfungsi","not functioning"],["tidak ada masalah","no issues found"],
    ["ada masalah","there is a problem"],["baterai internal","internal battery"],
    ["baterai lemah","battery is low"],["perlu diganti","needs replacement"],
    ["perlu penggantian","needs replacement"],["sudah diganti","already replaced"],
    ["kondisi baik","in good condition"],["kondisi kurang baik","in poor condition"],
    ["lampu belakang mati","rear lamp is off"],["lampu belakang","rear lamp"],
    ["lampu depan","front lamp"],["lampu mati","lamp off"],["kipas mati","fan off"],
    ["kipas berisik","fan is noisy"],["agak kotor","slightly dirty"],["sangat kotor","very dirty"],
    ["rusak ringan","minor damage"],["tidak ada","not present"],["rusak","damaged"],
    ["mati","off"],["hidup","on"],["kotor","dirty"],["bersih","clean"],["longgar","loose"],
    ["kendor","loose"],["berisik","noisy"],["bocor","leaking"],["panas","hot"],
    ["normal","normal"],["baik","good"],["lemah","weak"],["cek","check"],["ganti","replace"],
    ["perlu","needs"],["dan","and"],["atau","or"],["pada","on"],["sudah","already"],
    ["belum","not yet"],["dari","from"],["modul","module"],["kabel","cable"],["saklar","switch"],
    ["perlu dicek","needs to be checked"],["dicek","checked"]
  ];
  function looksIndonesian(text){
    var lower = text.toLowerCase();
    return DICT.some(function(pair){ return lower.indexOf(pair[0]) > -1; });
  }
  function pseudoTranslate(text){
    if (!text) return '';
    if (!looksIndonesian(text)) return text;
    var out = text.toLowerCase();
    DICT.slice().sort(function(a,b){ return b[0].length - a[0].length; }).forEach(function(pair){
      out = out.split(pair[0]).join(pair[1]);
    });
    return out.charAt(0).toUpperCase() + out.slice(1);
  }

        else if (c.label.indexOf('Woodward Module B') === 0) { out.c4mb = reading; out.c4mbStatus = value; if (isPresentVal_(value) || isPresentVal_(reading)) out.c4 = out.c4 || 'WOOD WARD'; }
        else if (c.label.indexOf('Woodward Module C') === 0) { out.c4mc = reading; out.c4mcStatus = value; if (isPresentVal_(value) || isPresentVal_(reading)) out.c4 = out.c4 || 'WOOD WARD'; }
      } else if (c.kind === 'controller') {
        var typeEl = document.getElementById(c.typeId), stEl2 = document.getElementById(c.statusId);
        var type = typeEl ? typeEl.value.trim() : '', status = stEl2 ? stEl2.value : '';

        if (keyMap[c.label]) out[keyMap[c.label]] = value2;
      }
    });
    // C4 tipe: kalau mode manual ada input teks pw_c4, itu yang menang (override).

    return { flat: out, reportData: { desc: desc, title: title, cab: cab, components: reportComponents, condition: out.panelCondition, note: out.note } };
  }
  function isPresentVal_(v){

  // ---------- findings / report text (dipakai form aktif MAUPUN Data screen) ----------
  function findingsFor(panel, data){
    var findings = [];
    var cabDefsForPanel = CAB_DEFS.slice();
    if (isItccp(panel)) cabDefsForPanel.push(CAB_FAN_RUNNING);
    cabDefsForPanel.forEach(function(defs){
      var raw = (data.cab && data.cab[defs.key]) || defs.options[0][0];
      var resolved = cabResolve(defs, raw);
      if (resolved && resolved.severity) findings.push({ label: defs.label, word: resolved.word, severity: resolved.severity });
    });
    (data.components || []).forEach(function(c){
      var word = statusWord(c.value);
      if (!word) return;
      var sev = severityOfComponent(word);
      if (sev) findings.push({ label: c.label, word: word, severity: sev });
    });
    return findings;
  }

  function buildReportText(panel, data){
    var checklistLines = [];
    var cabDefsForPanel = CAB_DEFS.slice();
    if (isItccp(panel)) cabDefsForPanel.push(CAB_FAN_RUNNING);
    cabDefsForPanel.forEach(function(defs){
      var raw = (data.cab && data.cab[defs.key]) || defs.options[0][0];
      var resolved = cabResolve(defs, raw);
      if (!resolved) return;
      checklistLines.push('\t\t> ' + defs.label + ' (' + resolved.word + ')');
    });
    (data.components || []).forEach(function(c){
      var word = statusWord(c.value);
      if (!word) return;
      var line = '\t\t> ' + c.label + ' (' + word + ')';
      if (c.kind === 'pair' && c.reading && c.reading !== '-') line += ', ' + c.unit + ': ' + c.reading + (c.suffix || '');
      checklistLines.push(line);
    });

    var findings = findingsFor(panel, data);
    var highCount = findings.filter(function(f){ return f.severity === 'high'; }).length;
    var medCount = findings.filter(function(f){ return f.severity === 'medium'; }).length;

    var summaryText;
    if (findings.length === 0) {
      summaryText = 'Overall condition: GOOD - no issues found.';
    } else {
      var parts = [];
      if (highCount) parts.push(highCount + (highCount > 1 ? ' critical items' : ' critical item'));
      if (medCount) parts.push(medCount + (medCount > 1 ? ' minor items' : ' minor item'));
      summaryText = 'Overall condition: NEEDS ATTENTION - ' + parts.join(' and ') + ' flagged (see NB below).';
    }

    var recommendationText;
    if (highCount > 0) {
      var highLabels = findings.filter(function(f){ return f.severity === 'high'; }).map(function(f){ return f.label; }).join('; ');
      recommendationText = 'Recommendation: Immediate follow-up required for ' + highLabels + '.';
    } else if (medCount > 0) {
      var medLabels = findings.filter(function(f){ return f.severity === 'medium'; }).map(function(f){ return f.label; }).join('; ');
      recommendationText = 'Recommendation: Schedule monitoring/maintenance for ' + medLabels + ' on next visit.';
    } else {
      recommendationText = 'Recommendation: No action required, panel in good condition.';
    }

    var noteLines = (data.note || '').split('\n').map(function(s){ return s.trim(); }).filter(Boolean)
      .map(function(s){ return pseudoTranslate(s); });
    var nbLines = findings.map(function(f){ return f.label + ' - ' + f.word; }).concat(noteLines);

    var lines = [];
    lines.push(panel + '\t' + (data.desc || '-') + '\tPM Cabinet And Accessories Check ' + (data.title || '-'));
    lines = lines.concat(checklistLines);
    lines.push('');
    lines.push('\t\t' + summaryText);
    if (nbLines.length) {
      lines.push('\t\tNB : ');
      nbLines.forEach(function(n){ lines.push('\t\t- ' + n); });
    }
    lines.push('\t\t' + recommendationText);
    return lines.join('\n');
  }

  function badgeInfo(panel, data){
    var findings = findingsFor(panel, data);
    var highCount = findings.filter(function(f){ return f.severity === 'high'; }).length;
    var medCount = findings.filter(function(f){ return f.severity === 'medium'; }).length;
    if (highCount > 0) return { cls: 'high', text: 'NEEDS ATTENTION', icon: 'ti-alert-triangle' };
    if (medCount > 0) return { cls: 'medium', text: 'MINOR ISSUE', icon: 'ti-alert-circle' };
    return { cls: 'good', text: 'GOOD', icon: 'ti-circle-check' };
  }

  function gasNow(){
    var d = new Date(), p = function(n){ return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' +
           p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());

  // ---------- timer stabilisasi ----------
  // Waktu mulai disimpan di localStorage, bukan di memori, supaya hitung mundur
  // tetap benar walau halaman di-refresh atau app ditutup sebentar di lapangan.
  function gasTimerKey(idPm, no){ return 'pmGasTimer:' + idPm + ':' + no; }
  function gasTimerSisa(key){
    var t;
    try { t = localStorage.getItem(key); } catch (e) { t = null; }
    if (!t) return null;
    return Math.max(GAS_WAIT_SECONDS - Math.floor((Date.now() - Number(t)) / 1000), 0);
  }
  function gasTimerMulai(key){ try { localStorage.setItem(key, String(Date.now())); } catch (e) {} }
  function gasTimerHapus(key){ try { localStorage.removeItem(key); } catch (e) {} }
  function gasFormatJam(detik){
    return String(Math.floor(detik / 60)).padStart(2, '0') + ':' + String(detik % 60).padStart(2, '0');
  }
  function stopGasTimer(){
    if (gasTimerTick) { clearInterval(gasTimerTick); gasTimerTick = null; }
  }

  // ---------- daftar sesi PM ----------
  function goGasHome(){
    showScreen('pwGasHome');
    setChrome({ back: true, backTo: goMenu, title: 'PM Gas Analyzer', sub: 'Daftar sesi verifikasi' });
    gasCurrentSesi = null;
    loadGasSessions();
  }
  function loadGasSessions(){
    pwGasList.innerHTML = '<div class="pmw-empty"><span class="pmw-spinner" aria-hidden="true"></span> Memuat sesi PM...</div>';
    apiGet('gasHeaders').then(function(list){
      gasSessionCache = list || [];
      renderGasList();
    }).catch(function(err){
      pwGasCount.textContent = '';
      pwGasList.innerHTML = '<div class="pmw-empty"><i class="ti ti-alert-circle" aria-hidden="true"></i>' + err.message + '</div>';
    });
  }
  function renderGasList(){
    var q = (pwGasSearch.value || '').trim().toLowerCase();
    var items = gasSessionCache.filter(function(s){
      if (!q) return true;
      return [s.id_pm, s.id_analyzer, s.teknisi, s.jenis_gas].join(' ').toLowerCase().indexOf(q) > -1;
    }).slice().reverse();

    pwGasCount.textContent = '(' + gasSessionCache.length + ' sesi)';
    pwGasList.innerHTML = '';
    if (!items.length){
      pwGasList.innerHTML = '<div class="pmw-empty"><i class="ti ti-inbox" aria-hidden="true"></i>Belum ada sesi PM. Mulai lewat tombol "Sesi PM baru".</div>';
      return;
    }
    items.forEach(function(s){
      var wrap = document.createElement('div'); wrap.className = 'pmw-datarow';
      var top = document.createElement('div'); top.className = 'pmw-datarow-top';
      var left = document.createElement('div');
      left.innerHTML = '<div class="panel"><i class="ti ti-gauge" aria-hidden="true"></i>' + (s.id_analyzer || '-') + '</div>' +
        '<div class="date">' + (s.id_pm || '-') + (s.tanggal ? ' &middot; ' + s.tanggal : '') +
        (s.jenis_gas ? ' &middot; ' + s.jenis_gas : '') + '</div>';
      var selesai = String(s.status_akhir || '').toLowerCase().indexOf('selesai') > -1;
      var pill = document.createElement('span');
      pill.className = 'pmw-statuspill ' + (selesai ? 'good' : 'medium');
      pill.innerHTML = '<i class="ti ' + (selesai ? 'ti-circle-check' : 'ti-clock') + '" aria-hidden="true"></i>' + (s.status_akhir || 'Berjalan');
      top.appendChild(left); top.appendChild(pill);
      wrap.appendChild(top);

      var act = document.createElement('div'); act.className = 'pmw-datarow-actions';
      var open = document.createElement('button');
      open.type = 'button'; open.className = 'pmw-mini-btn';
      open.innerHTML = '<i class="ti ti-square-plus" aria-hidden="true"></i>Input iterasi' +
        (s.jumlah_iterasi ? ' (' + s.jumlah_iterasi + ')' : '');
      open.addEventListener('click', function(){ openGasIter(s); });
      act.appendChild(open);
      wrap.appendChild(act);
      pwGasList.appendChild(wrap);
    });
  }
  pwGasSearch.addEventListener('input', renderGasList);
  document.getElementById('pwGasNewBtn').addEventListener('click', openGasSesi);

  // ---------- form sesi baru ----------
  function openGasSesi(){
    showScreen('pwGasSesi');
    setChrome({ back: true, backTo: goGasHome, title: 'Sesi PM baru', sub: 'Identitas sesi verifikasi analyzer' });
    var wrap = document.getElementById('pwGasSesi');
    wrap.innerHTML = '';

    var c1 = card('Identitas sesi', null, 'ti-info-circle'); var r1 = row('c2');
    var tgl = document.createElement('input'); tgl.type = 'date'; tgl.id = 'pwGasTanggal'; tgl.value = today();
    r1.appendChild(field('Tanggal', tgl));
    r1.appendChild(field('ID Analyzer', plainText('', 'cth: AI-101', 'pwGasAnalyzer')));
    r1.appendChild(field('Teknisi', plainText('', 'nama teknisi', 'pwGasTeknisi')));
    c1.appendChild(r1); wrap.appendChild(c1);

    var c2 = card('Tabung gas', 'zero & span', 'ti-bolt'); var r2 = row('c2');
    r2.appendChild(field('ID Tabung Zero', plainText('', 'cth: TZ-01', 'pwGasTabungZero')));
    r2.appendChild(field('ID Tabung Span', plainText('', 'cth: TS-01', 'pwGasTabungSpan')));
    r2.appendChild(field('Tekanan Zero', plainText('', 'cth: 120 bar', 'pwGasTekananZero')));
    r2.appendChild(field('Tekanan Span', plainText('', 'cth: 115 bar', 'pwGasTekananSpan')));
    c2.appendChild(r2); wrap.appendChild(c2);

    var c3 = card('Catatan', null, 'ti-notes');
    var ta = document.createElement('textarea'); ta.id = 'pwGasCatatan'; ta.rows = 2; ta.placeholder = 'Opsional';
    c3.appendChild(field('Catatan sesi', ta)); wrap.appendChild(c3);

    var save = document.createElement('button');
    save.type = 'button'; save.className = 'pmw-btn primary block';
    save.innerHTML = '<i class="ti ti-device-floppy" aria-hidden="true"></i>Buat sesi PM';
    save.addEventListener('click', function(){ simpanGasSesi(save); });
    wrap.appendChild(save);
  }
  function simpanGasSesi(btn){
    var analyzer = (document.getElementById('pwGasAnalyzer').value || '').trim();
    if (!analyzer) { showBanner('ID Analyzer wajib diisi.', true); return; }
    var val = function(id, def){ var v = (document.getElementById(id).value || '').trim(); return v || def; };
    var payload = {
      tanggal: document.getElementById('pwGasTanggal').value,
      id_analyzer: analyzer,
      teknisi: val('pwGasTeknisi', '-'),
      id_tabung_zero: val('pwGasTabungZero', '-'),
      id_tabung_span: val('pwGasTabungSpan', '-'),
      tekanan_zero: val('pwGasTekananZero', '-'),
      tekanan_span: val('pwGasTekananSpan', '-'),
      catatan: document.getElementById('pwGasCatatan').value || ''
    };
    var label = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="pmw-spinner" aria-hidden="true"></span> Menyimpan...';
    apiPost('gasHeaderSubmit', { data: payload }).then(function(res){
      showBanner(res.message || 'Sesi PM dibuat.');
      goGasHome();
    }).catch(function(err){
      showBanner('Gagal membuat sesi: ' + err.message, true);
      btn.disabled = false; btn.innerHTML = label;
    });
  }

  // ---------- layar iterasi ----------
  function openGasIter(sesi){
    gasCurrentSesi = sesi;
    showScreen('pwGasIter');
    setChrome({ back: true, backTo: goGasHome, title: sesi.id_analyzer || sesi.id_pm, sub: 'Memuat iterasi...' });
    var wrap = document.getElementById('pwGasIter');
    wrap.innerHTML = '<div class="pmw-empty"><span class="pmw-spinner" aria-hidden="true"></span> Memuat iterasi...</div>';
    apiGet('gasDetails', { id_pm: sesi.id_pm }).then(function(list){
      gasDetailCache = list || [];
      buildGasIter();
    }).catch(function(err){
      // Nomor iterasi berikutnya dihitung dari data yang sudah ada. Kalau data itu
      // gagal dimuat, form sengaja TIDAK ditampilkan - menebak nomornya berisiko
      // membuat iterasi bernomor ganda di sheet.
      wrap.innerHTML = '';
      var c = card('Gagal memuat iterasi', null, 'ti-alert-circle');
      var p = document.createElement('div'); p.className = 'pmw-empty'; p.textContent = err.message;
      c.appendChild(p);
      var retry = document.createElement('button');
      retry.type = 'button'; retry.className = 'pmw-btn block';
      retry.innerHTML = '<i class="ti ti-refresh" aria-hidden="true"></i>Coba lagi';
      retry.addEventListener('click', function(){ openGasIter(sesi); });
      c.appendChild(retry); wrap.appendChild(c);
    });
  }
  function buildGasIter(){
    var sesi = gasCurrentSesi;
    var wrap = document.getElementById('pwGasIter');
    wrap.innerHTML = '';

    var nextNo = gasDetailCache.length + 1;
    var penuh = nextNo > GAS_MAX_ITERASI;
    setChrome({ back: true, backTo: goGasHome, title: sesi.id_analyzer || sesi.id_pm,
      sub: penuh ? 'Iterasi sudah penuh' : 'Iterasi berikutnya: ke-' + nextNo });

    var cInfo = card('Sesi', sesi.id_pm, 'ti-info-circle');
    [['Tanggal', sesi.tanggal], ['Analyzer', sesi.id_analyzer], ['Jenis gas', sesi.jenis_gas],
     ['Teknisi', sesi.teknisi],
     ['Tabung zero / span', (sesi.id_tabung_zero || '-') + ' / ' + (sesi.id_tabung_span || '-')],
     ['Tekanan zero / span', (sesi.tekanan_zero || '-') + ' / ' + (sesi.tekanan_span || '-')]
    ].forEach(function(p){
      var d = document.createElement('div'); d.className = 'pmw-readonly';
      d.innerHTML = '<span>' + p[0] + '</span><b>' + (p[1] || '-') + '</b>';
      cInfo.appendChild(d);
    });
    wrap.appendChild(cInfo);

    if (penuh){
      var cFull = card('Batas iterasi tercapai', null, 'ti-alert-circle');
      var e = document.createElement('div'); e.className = 'pmw-empty';
      e.textContent = 'Sesi ini sudah mencapai ' + GAS_MAX_ITERASI + ' iterasi. Buat sesi PM baru bila masih perlu verifikasi lanjutan.';
      cFull.appendChild(e); wrap.appendChild(cFull);
    } else {
      wrap.appendChild(buildGasIterForm(sesi, nextNo));
    }

    var cList = card('Iterasi tersimpan', '(' + gasDetailCache.length + ')', 'ti-list-details');
    if (!gasDetailCache.length){
      var em = document.createElement('div'); em.className = 'pmw-empty';
      em.innerHTML = '<i class="ti ti-inbox" aria-hidden="true"></i>Belum ada iterasi pada sesi ini.';
      cList.appendChild(em);
    } else {
      gasDetailCache.slice().sort(function(a, b){ return Number(a.no_iterasi) - Number(b.no_iterasi); })
        .forEach(function(d){ cList.appendChild(gasIterRow(d)); });
    }
    wrap.appendChild(cList);
  }
  function buildGasIterForm(sesi, no){
    var c = card('Input iterasi ke-' + no, 'catat setelah gas stabil', 'ti-square-plus');
    var key = gasTimerKey(sesi.id_pm, no);

    var timer = document.createElement('div'); timer.className = 'pmw-timer'; timer.id = 'pwGasTimer';
    var clock = document.createElement('div'); clock.className = 'clock'; clock.id = 'pwGasClock';
    var lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.id = 'pwGasTimerLbl';
    var tbtn = document.createElement('button'); tbtn.type = 'button'; tbtn.className = 'pmw-mini-btn'; tbtn.id = 'pwGasTimerBtn';
    timer.appendChild(clock); timer.appendChild(lbl); timer.appendChild(tbtn);
    c.appendChild(timer);

    var r = row('c2');
    r.appendChild(field('Tahap', select(GAS_TAHAP, GAS_TAHAP[0], 'pwGasTahap')));
    r.appendChild(field('Pembacaan Zero', numberInput('pwGasZero', 'cth: 0.02')));
    r.appendChild(field('Pembacaan Span', numberInput('pwGasSpan', 'cth: 49.8')));
    r.appendChild(field('Toleransi Zero (%)', numberInput('pwGasTolZero', '', GAS_TOLERANSI_DEFAULT)));
    r.appendChild(field('Toleransi Span (%)', numberInput('pwGasTolSpan', '', GAS_TOLERANSI_DEFAULT)));
    r.appendChild(field('Tindakan kalibrasi', plainText('', 'opsional', 'pwGasTindakan')));
    c.appendChild(r);

    var ta = document.createElement('textarea'); ta.id = 'pwGasIterCatatan'; ta.rows = 2; ta.placeholder = 'Opsional';
    c.appendChild(field('Catatan', ta));

    var save = document.createElement('button');
    save.type = 'button'; save.className = 'pmw-btn primary block'; save.id = 'pwGasSaveIter';
    save.addEventListener('click', function(){ simpanGasIter(sesi, no, save); });
    c.appendChild(save);

    // Timer dirender setelah kartu masuk DOM (elemen dicari lewat getElementById).
    setTimeout(function(){ startGasTimerUI(key); }, 0);
    return c;
  }
  function startGasTimerUI(key){
    var timer = document.getElementById('pwGasTimer');
    if (!timer) return;
    var clock = document.getElementById('pwGasClock');
    var lbl = document.getElementById('pwGasTimerLbl');
    var tbtn = document.getElementById('pwGasTimerBtn');
    var save = document.getElementById('pwGasSaveIter');
    var lastState = null;

    function setEnabled(on){
      ['pwGasZero', 'pwGasSpan'].forEach(function(id){
        var el = document.getElementById(id); if (el) el.disabled = !on;
      });
      if (save){
        save.disabled = !on;
        save.innerHTML = on ? '<i class="ti ti-device-floppy" aria-hidden="true"></i>Catat pembacaan'
                            : '<i class="ti ti-clock" aria-hidden="true"></i>Tunggu stabilisasi dulu';
      }
    }
    function render(){
      var sisa = gasTimerSisa(key);
      var state = sisa === null ? 'idle' : (sisa > 0 ? 'wait' : 'done');
      if (state === 'wait') clock.textContent = gasFormatJam(sisa);
      if (state === lastState) return;          // hanya tulis ulang saat status berubah
      lastState = state;
      if (state === 'idle'){
        timer.className = 'pmw-timer';
        clock.textContent = gasFormatJam(GAS_WAIT_SECONDS);
        lbl.textContent = 'Alirkan gas, lalu mulai hitung mundur stabilisasi ' + (GAS_WAIT_SECONDS / 60) + ' menit.';
        tbtn.textContent = 'Mulai';
        setEnabled(false);
      } else if (state === 'wait'){
        timer.className = 'pmw-timer';
        lbl.textContent = 'Menunggu stabilisasi gas. Hitung mundur tetap jalan walau halaman ditutup.';
        tbtn.textContent = 'Ulangi';
        setEnabled(false);
      } else {
        timer.className = 'pmw-timer done';
        clock.textContent = '00:00';
        lbl.textContent = 'Gas sudah stabil - silakan catat pembacaan.';
        tbtn.textContent = 'Ulangi';
        setEnabled(true);
      }
    }
    tbtn.addEventListener('click', function(){
      gasTimerHapus(key); gasTimerMulai(key);
      lastState = null; render();
    });
    render();
    stopGasTimer();
    gasTimerTick = setInterval(render, 1000);
  }
  function simpanGasIter(sesi, no, btn){
    var zero = document.getElementById('pwGasZero').value;
    var span = document.getElementById('pwGasSpan').value;
    if (zero === '' && span === ''){
      showBanner('Isi minimal salah satu pembacaan (zero atau span).', true);
      return;
    }
    var payload = {
      id_pm: sesi.id_pm,
      no_iterasi: no,
      tahap: document.getElementById('pwGasTahap').value,
      waktu: gasNow(),
      pembacaan_zero: zero,
      pembacaan_span: span,
      toleransi_zero: document.getElementById('pwGasTolZero').value,
      toleransi_span: document.getElementById('pwGasTolSpan').value,
      tindakan_kalibrasi: (document.getElementById('pwGasTindakan').value || '').trim(),
      catatan: document.getElementById('pwGasIterCatatan').value || ''
    };
    var label = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="pmw-spinner" aria-hidden="true"></span> Menyimpan...';
    apiPost('gasDetailSubmit', { data: payload }).then(function(res){
      gasTimerHapus(gasTimerKey(sesi.id_pm, no));
      showBanner(res.message || 'Iterasi tersimpan.');
      openGasIter(sesi);                       // muat ulang supaya nomor iterasi ikut naik
    }).catch(function(err){
      showBanner('Gagal menyimpan iterasi: ' + err.message, true);
      btn.disabled = false; btn.innerHTML = label;
    });
  }
  function gasIterRow(d){
    var wrap = document.createElement('div'); wrap.className = 'pmw-datarow';
    var top = document.createElement('div'); top.className = 'pmw-datarow-top';
    var left = document.createElement('div');
    left.innerHTML = '<div class="panel"><i class="ti ti-square-plus" aria-hidden="true"></i>Iterasi ke-' + (d.no_iterasi || '?') + '</div>' +
      '<div class="date">' + (d.tahap || '-') + (d.waktu ? ' &middot; ' + d.waktu : '') + '</div>';
    top.appendChild(left);
    if (d.status){
      var st = String(d.status).toLowerCase();
      var cls = (st.indexOf('lulus') > -1 || st.indexOf('pass') > -1 || st.indexOf('ok') > -1) ? 'good'
              : ((st.indexOf('gagal') > -1 || st.indexOf('fail') > -1) ? 'high' : 'medium');
      var pill = document.createElement('span');
      pill.className = 'pmw-statuspill ' + cls;
      pill.textContent = d.status;
      top.appendChild(pill);
    }
    wrap.appendChild(top);
    [['Zero', d.pembacaan_zero, d.standar_zero, d.deviasi_zero],
     ['Span', d.pembacaan_span, d.standar_span, d.deviasi_span]].forEach(function(p){
      var r = document.createElement('div'); r.className = 'pmw-readonly';
      r.innerHTML = '<span>' + p[0] + ' &middot; baca / standar / deviasi</span><b>' +
        (p[1] || '-') + ' / ' + (p[2] || '-') + ' / ' + (p[3] || '-') + '</b>';
      wrap.appendChild(r);
    });
    if (d.peringatan){
      var w = document.createElement('div'); w.className = 'pmw-readonly';
      w.innerHTML = '<span>Peringatan</span><b>' + d.peringatan + '</b>';
      wrap.appendChild(w);
    }
    return wrap;
  }

  // ---------- PWA: registrasi service worker ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').catch(function(){ /* diamkan kalau gagal, app tetap jalan tanpa PWA */ });
    });
  }

  goMenu();
})();
</script>
